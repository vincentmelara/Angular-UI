<mat-sidenav-container class="shell">
  <mat-sidenav
    #drawer
    class="sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
  >
    <div class="sidenav-brand">
      <mat-icon>school</mat-icon>
      <span>LearnHub</span>
    </div>

    <mat-nav-list>
      @for (item of nav; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive
          #rla="routerLinkActive"
          [activated]="rla.isActive"
          (click)="isHandset() && drawer.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <mat-toolbar class="topbar">
      @if (isHandset()) {
        <button mat-icon-button (click)="drawer.toggle()" aria-label="Toggle navigation">
          <mat-icon>menu</mat-icon>
        </button>
      }

      <span class="spacer"></span>

      <button mat-icon-button matTooltip="Notifications" aria-label="Notifications">
        <mat-icon>notifications</mat-icon>
      </button>

      <button
        mat-icon-button
        (click)="theme.cycle()"
        [matTooltip]="'Theme: ' + theme.mode()"
        aria-label="Toggle theme"
      >
        <mat-icon>
          @switch (theme.mode()) {
            @case ('light') { light_mode }
            @case ('dark') { dark_mode }
            @default { contrast }
          }
        </mat-icon>
      </button>

      <button mat-button [matMenuTriggerFor]="userMenu" class="user-button">
        <span class="avatar">{{ initials() }}</span>
        <span class="user-name">{{ user()?.name }}</span>
        <mat-icon iconPositionEnd>expand_more</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu" xPosition="before">
        <div class="menu-header">
          <strong>{{ user()?.name }}</strong>
          <span>{{ user()?.email }}</span>
        </div>
        <mat-divider />
        <button mat-menu-item>
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </button>
        <button mat-menu-item>
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>
        <mat-divider />
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Sign out</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="page">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
